name: Sandwich-Karte abgleichen

on:
  # GitHub plant in UTC (10:00 UTC = 12:00 Sommerzeit, 11:00 UTC = 12:00 Winterzeit) und startet
  # geplante Läufe oft verspätet oder lässt sie aus. Deshalb mehrere Versuche ab 12 Uhr:
  # das Skript gleicht beim ersten Lauf ab 12 Uhr Berliner Zeit ab und danach an dem Tag nicht mehr.
  schedule:
    - cron: '3,18,33,48 10-12 * * *'
    - cron: '3 13-20 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Sofort abgleichen (12-Uhr-Prüfung ignorieren)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/sync.mjs ${{ inputs.force && '--force' || '' }}
      - name: Änderungen speichern
        run: |
          git config user.name "sandwich-karte-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data images CHANGELOG.md
          git diff --cached --quiet || { git commit -m "Karte abgeglichen $(TZ=Europe/Berlin date +%F)" && git push; }
